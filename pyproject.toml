[project]
name = "context-cli"
version = "0.1.0"
description = "Windows 资源管理器「快捷执行」右键菜单 CLI 管理器"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
context-cli = "context_cli.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
